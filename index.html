<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17152f">
  <title>LEADERSHIP MODULE · QR Scanner</title>
  <style>
    :root{color-scheme:light;--ink:#20243a;--muted:#687086;--purple:#6851dc;--line:#e5e6ef}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:22px 16px;background:#f3f4fa;color:var(--ink);font:16px/1.5 Arial,sans-serif}
    main{width:min(100%,560px);margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 12px 36px #1d214015}
    .eyebrow{color:#7968c9;font-size:12px;font-weight:800;letter-spacing:2px}
    h1{margin:8px 0 6px;font-size:27px;line-height:1.2}
    .context{color:var(--muted);margin:0 0 18px;overflow-wrap:anywhere}
    #reader{width:100%;min-height:280px;border:1px dashed #c9c7db;border-radius:16px;overflow:hidden;background:#f7f6fc}
    #reader video{object-fit:cover}
    .status{min-height:52px;margin:14px 0;color:#5d4c9e;font-weight:700;overflow-wrap:anywhere}
    .status.error{color:#a12d45}
    label{display:block;margin:18px 0 7px;color:#555d70;font-weight:700}
    input{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;font-size:17px}
    button{border:0;border-radius:12px;padding:14px 18px;font-size:16px;font-weight:700;cursor:pointer}
    button:disabled{opacity:.5;cursor:not-allowed}
    .primary{width:100%;margin-top:10px;color:#fff;background:var(--purple)}
    .secondary{color:#4c5264;background:#eef0f5}
    .actions{display:flex;gap:10px;margin-top:12px}
    .actions button{flex:1}
    .note{margin-top:20px;color:#7b8190;font-size:13px}
    .pill{display:inline-block;padding:4px 9px;border-radius:99px;background:#f0edff;color:#5d4c9e;font-size:12px;font-weight:700}
  </style>
</head>
<body>
<main>
  <span class="eyebrow">ATTENDANCE QUICK SCAN</span>
  <h1>Scan Student QR Code</h1>
  <p class="context" id="context">Loading selected session…</p>
  <div id="reader"></div>
  <p id="status" class="status" role="status" aria-live="polite">Preparing camera…</p>
  <label for="studentId">Or enter Student ID manually</label>
  <input id="studentId" inputmode="numeric" autocomplete="off" placeholder="Enter student ID">
  <button id="check" class="primary" type="button">Check Student ID</button>
  <div class="actions">
    <button id="restart" class="secondary" type="button">Restart camera</button>
    <button id="back" class="secondary" type="button">Close scanner</button>
  </div>
  <p class="note">The scanner sends the captured ID to LEADERSHIP MODULE. The scanner closes after sending a Student ID so the form is visible. Save or cancel the form to reopen scanning. <span class="pill" id="state">CONNECTING</span></p>
</main>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
(() => {
  'use strict';
  const params = new URLSearchParams(location.search);
  const session = {
    module: params.get('module') || '',
    date: params.get('date') || '',
    group: params.get('group') || '',
    token: params.get('token') || ''
  };
  const $ = id => document.getElementById(id);
  let scanner = null;
  let busy = false;
  let starting = false;
  let closed = false;

  $('context').textContent = `${session.module || 'Module not selected'} · ${session.date || 'Date not selected'} · ${session.group ? 'Group ' + session.group : 'All groups'}`;

  function setStatus(message, isError = false) {
    $('status').textContent = message;
    $('status').classList.toggle('error', isError);
  }

  function setState(value) { $('state').textContent = value; }

  function extractStudentId(raw) {
    const value = String(raw || '').trim();
    const labelled = value.match(/(?:STUDENT[_\s-]*ID|STUDENTID|ID)\s*[:=#/ ]\s*([0-9]{6,15})/i);
    if (labelled) return labelled[1];
    const query = value.match(/[?&](?:student[_-]?id|studentid|id)=([0-9]{6,15})(?:&|$)/i);
    if (query) return query[1];
    const plain = value.match(/^([0-9]{6,15})$/);
    if (plain) return plain[1];
    const numeric = value.match(/\b([0-9]{6,15})\b/);
    if (numeric) return numeric[1];
    throw new Error('QR code does not contain a valid Student ID (6–15 digits).');
  }

  async function stopCamera() {
    if (!scanner) return;
    const current = scanner;
    scanner = null;
    try { if (current.isScanning) await current.stop(); } catch (error) {}
    try { current.clear(); } catch (error) {}
  }

  function sendToOpener(message) {
    if (!window.opener || window.opener.closed) {
      throw new Error('The LEADERSHIP MODULE window is not connected. Close this scanner and open it again from the attendance page.');
    }
    window.opener.postMessage(Object.assign({}, message, { token: session.token }), '*');
  }

  async function sendStudentId(raw) {
    if (busy || closed) return;
    let studentId;
    try { studentId = extractStudentId(raw); }
    catch (error) { setStatus(error.message, true); return; }

    if (!session.module || !session.date || !session.token) {
      setStatus('Module, session date or scanner token is missing. Reopen the scanner from LEADERSHIP MODULE.', true);
      return;
    }

    busy = true;
    $('check').disabled = true;
    $('restart').disabled = true;
    setState('SENDING');
    setStatus(`Student ID ${studentId} captured. Sending to LEADERSHIP MODULE…`);
    await stopCamera();

    try {
      sendToOpener({
        type: 'LEADERSHIP_MODULE_QR_RESULT',
        studentId,
        module: session.module,
        date: session.date,
        group: session.group
      });
      setStatus(`Student ID ${studentId} sent. Complete the attendance or registration form in LEADERSHIP MODULE. The scanner will resume automatically afterwards.`);
      setState('WAITING FOR FORM');
    } catch (error) {
      busy = false;
      $('check').disabled = false;
      $('restart').disabled = false;
      setState('NOT CONNECTED');
      setStatus(error.message || String(error), true);
    }
  }

  async function startCamera() {
    if (closed || busy || starting) return;
    starting = true;
    await stopCamera();
    if (typeof Html5Qrcode === 'undefined') {
      starting = false;
      setState('LIBRARY ERROR');
      setStatus('QR scanner library did not load. Check internet access or use manual Student ID entry.', true);
      return;
    }
    setStatus('Requesting camera access…');
    try {
      scanner = new Html5Qrcode('reader');
      const cameras = await Html5Qrcode.getCameras();
      if (!cameras || !cameras.length) throw new Error('No camera was detected on this device.');
      const preferred = cameras.find(camera => /back|rear|environment|world/i.test(camera.label)) || cameras[cameras.length - 1];
      await scanner.start(
        preferred.id,
        { fps: 10, qrbox: { width: 245, height: 245 }, aspectRatio: 1 },
        decodedText => sendStudentId(decodedText),
        () => {}
      );
      setState('SCANNING');
      setStatus('Camera ready. Point it at the QR code on the student card.');
    } catch (error) {
      await stopCamera();
      setState('CAMERA ERROR');
      setStatus('Unable to start camera: ' + (error && error.message ? error.message : String(error)) + '. Check Chrome camera permission or enter the Student ID manually.', true);
    } finally {
      starting = false;
    }
  }

  function handleParentMessage(event) {
    if (event.source !== window.opener) return;
    const data = event.data;
    if (!data || typeof data !== 'object' || data.token !== session.token) return;

    if (data.type === 'LEADERSHIP_MODULE_QR_RECEIVED') {
      // The parent has received the ID. Close this popup so its attendance or
      // registration form is no longer hidden behind the scanner window.
      closed = true;
      setStatus(`Student ID ${data.studentId || ''} received. Returning to LEADERSHIP MODULE…`);
      setState('HANDED OFF');
      stopCamera().finally(() => setTimeout(() => {
        try { window.close(); } catch (error) {}
      }, 100));
      return;
    }

    if (data.type === 'LEADERSHIP_MODULE_QR_RESUME') {
      busy = false;
      $('check').disabled = false;
      $('restart').disabled = false;
      $('studentId').value = '';
      setState('RESUMING');
      startCamera();
      return;
    }

    if (data.type === 'LEADERSHIP_MODULE_QR_CLOSE') {
      closed = true;
      stopCamera().finally(() => window.close());
    }
  }

  $('check').addEventListener('click', () => sendStudentId($('studentId').value));
  $('studentId').addEventListener('keydown', event => {
    if (event.key === 'Enter') sendStudentId($('studentId').value);
  });
  $('restart').addEventListener('click', () => {
    busy = false;
    $('check').disabled = false;
    $('restart').disabled = false;
    startCamera();
  });
  $('back').addEventListener('click', async () => {
    closed = true;
    await stopCamera();
    try { sendToOpener({ type: 'LEADERSHIP_MODULE_QR_CLOSED' }); } catch (error) {}
    window.close();
  });
  window.addEventListener('message', handleParentMessage);
  window.addEventListener('pagehide', () => { closed = true; stopCamera(); });

  if (!session.module || !session.date || !session.token) {
    setState('MISSING SESSION');
    setStatus('Missing module, session date or token. Select a module and date in LEADERSHIP MODULE, then open the scanner again.', true);
  } else if (!window.opener || window.opener.closed) {
    setState('NOT CONNECTED');
    setStatus('Open this scanner using the Scan Student QR button in LEADERSHIP MODULE. Do not open the scanner URL directly.', true);
  } else {
    setState('SCANNING');
    startCamera();
  }
})();
</script>
</body>
</html>
